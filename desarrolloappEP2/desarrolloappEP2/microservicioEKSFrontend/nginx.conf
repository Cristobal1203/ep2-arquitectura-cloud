upstream get_products_svc {
    server get-products:3001;
}
upstream create_product_svc {
    server create-product:3002;
}
upstream update_product_svc {
    server update-product:3003;
}
upstream delete_product_svc {
    server delete-product:3004;
}

map $request_method $api_upstream {
    default get_products_svc;
    GET     get_products_svc;
    POST    create_product_svc;
    PUT     update_product_svc;
    DELETE  delete_product_svc;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/products {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $http_content_type;
    }
}
